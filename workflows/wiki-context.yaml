description: 为 Wiki workflow 交互式收集 vault，并用确定性脚本生成共享运行时上下文

auto_reset: true

manual_step:
  - collect_vault

adversarial_check:
  timeout_ms: 3600000
  system_prompt: |
    你是 Wiki Context 的只读审计者。只核对 check 列出的 artifacts 和关键磁盘事实，不得调用 context 生成脚本，不得修改 vault 或执行后续流程。
    每个 step 的 do 只生成声明的 artifact；check 只验收本步的必要不变量，不重复生成器已完成的全量扫描。

steps:
  - id: collect_vault
    desc: 交互式生成 vault 输入 artifact
    do: |
      只生成 `vault-input.json`，不读取 config 或 vault 内容。

      若调用方 inputs 含 `run_condition` 且父报告证明条件不成立，不向用户询问，直接写 `{"mode":"skipped","reason":"...","evidence":"..."}`。

      否则，从当前交互中获取 vault 路径；如用户尚未给出，明确请其输入。展开 `~`，并收集调用方 `requested_keys` 中用户提供的非秘密 overrides。

      将结果写为 `{"mode":"interactive","vault_path":"<expanded path>","overrides":{...}}`，展示给用户后等待 `/ralphflow-continue`；准备好后输出 `<promise>done</promise>`。
    input: 调用方 invocation、run_condition（如有）、requested_keys 和用户输入
    output: vault-input.json
    check: 解析 vault-input.json；skipped 时核对 reason/evidence，interactive 时核对已批准的绝对 vault path 和 requested_keys 内的非秘密 overrides；确认本步只产生该 artifact
    on_pass: resolve_context
    on_fail: collect_vault
    max_fail_count: 3

  - id: resolve_context
    desc: 调用随包发布的 resolver 生成 Wiki 共享上下文
    do: |
      使用已批准的 `vault-input.json` 和调用方 inputs 生成 `wiki-context.json` 与 `wiki-context.md`：

      ```bash
      obsidian-wiki wiki-context-resolve \
        --input "{{artifacts_dir}}/vault-input.json" \
        --source-cwd "<source-cwd>" \
        --requested-keys "<comma-separated requested_keys>" \
        --optional-reads "<comma-separated optional_reads>" \
        --setup-mode "<true-or-false>" \
        --output-dir "{{artifacts_dir}}"
      ```

      console script 不在 PATH 时使用等价的 `python3 -m obsidian_wiki wiki-context-resolve ...`。resolver 将 effective config、owner/Writing Profile metadata、requested optional metadata、active layout 状态及 retrieval order 写入声明的两个 artifacts。
    input: vault-input.json + 调用方传入的 source_cwd、requested_keys、optional_reads、setup_mode
    output: wiki-context.json + wiki-context.md
    check: 解析 context artifacts，核对 approved canonical vault、唯一 config source、requested keys 与 mode；请求 layout 时确认 marker status/hash 和 frozen routing 存在，skipped 时不带 config/vault 内容；确认除 artifacts 外零写入
    on_pass: done
    on_fail: resolve_context
    max_fail_count: 3
