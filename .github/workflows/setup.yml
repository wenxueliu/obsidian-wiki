name: setup

# Guards setup.py against the regression where it modifies tracked
# files. See #52 for the original bug.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-leaves-tree-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run setup.py
        # stdin closed so the vault-path prompt returns empty rather than hang
        run: python3 setup.py < /dev/null
      - name: Working tree must be unchanged
        run: |
          if ! git diff --exit-code; then
            echo "::error::setup.py modified tracked files. Likely cause: an" \
                 "in-repo symlink mirror is being written with an absolute" \
                 "target instead of a relative one."
            exit 1
          fi
      - name: Re-run is idempotent
        run: python3 setup.py < /dev/null && git diff --exit-code
