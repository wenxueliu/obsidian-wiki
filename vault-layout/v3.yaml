# V3 Software Engineering Knowledge Base — peer layout.
#
# Domain-driven structure with feature trees, code anchors, and
# time-archived requirements.  Shares the same infrastructure (system
# dirs + root files) as the default layout.

version: 2
description: Software engineering KB (domain-driven, feature tree, code anchors)

categories:
  - domain
  - artifacts

projects: domain

project_subdirs:
  - features

system:
  raw: _raw
  staging: _staging
  archives: _archives
  meta: _meta
  readouts: _readouts

extra_skip_dirs:
  - meta
  - scripts
  - .agent
  - traces
