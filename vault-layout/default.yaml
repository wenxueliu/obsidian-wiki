# obsidian-wiki default layout — general-purpose knowledge management.
#
# Categories are top-level content directories.  Use dot-separated paths
# to create nested subdirectories (e.g. "concepts.patterns" creates
# concepts/patterns/).  Subdirectories appear at setup time; skills
# (wiki-folder-ingest, wiki-capture) write to the top-level directory and may
# create further subdirs on demand.
#
# Available layouts are listed during `obsidian-wiki setup` or browsed
# with `obsidian-wiki setup --list-layouts`.

version: 2
description: General-purpose knowledge wiki (default)

categories:
  - concepts
  - concepts.patterns
  - concepts.models
  - entities
  - skills
  - skills.how-to
  - skills.debugging
  - references
  - synthesis
  - journal

projects: projects

project_subdirs:
  - concepts
  - skills
  - references

system:
  raw: _raw
  staging: _staging
  archives: _archives
  meta: _meta
  readouts: _readouts

extra_skip_dirs: []
