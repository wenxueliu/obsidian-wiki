# V3 Knowledge Base — vault-layout.yaml
#
# Copy to ~/.obsidian-wiki/vault-layout.yaml before running `obsidian-wiki setup`.
#
# This layout keeps obsidian-wiki's categories (concepts/ entities/ skills/
# etc.) alongside a V3 engineering knowledge base (domain/ artifacts/ traces/).
# The two systems coexist: obsidian-wiki handles general knowledge indexing/
# querying, V3 handles software engineering artifacts and traceability.
#
# Zero-conflict design:
#   - obsidian-wiki categories → general knowledge (concepts, entities, etc.)
#   - V3 content → domain/ + artifacts/  (visible to wiki-query, searchable)
#   - V3 operational dirs → extra_skip_dirs (excluded from lint/indexing)
#   - V3 templates → meta/ (NOT _meta/, which is obsidian-wiki's system dir)

version: 1

categories:
  - concepts
  - entities
  - skills
  - references
  - synthesis
  - journal

projects: projects

project_subdirs:
  - concepts
  - skills
  - references

system:
  raw: _raw
  staging: _staging
  archives: _archives
  meta: _meta
  readouts: _readouts

extra_skip_dirs:
  - meta       # V3 governance (templates, conventions, agent-instructions)
  - scripts    # V3 automation (idgenerator, viewgenerator, archiver)
  - .agent     # V3 agent workspace (prompts, context snapshots)
  - traces     # V3 generated views (auto-generated, not manually authored)
