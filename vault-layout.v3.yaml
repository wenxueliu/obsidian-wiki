# V3 Software Engineering Knowledge Base — vault-layout
#
# This is a PEER layout to the default obsidian-wiki layout (concepts/,
# entities/, skills/, references/, synthesis/, journal/).  Both share the
# same infrastructure (system dirs + root files) but differ in how they
# organise content.
#
# Copy to ~/.obsidian-wiki/vault-layout.yaml before running `obsidian-wiki setup`.
#
# What stays the same in every layout:
#   system:  _raw  _staging  _archives  _meta  _readouts
#   root:    index.md  log.md  hot.md  .manifest.json
#   exclude: .obsidian  .git  _archived  _bootstrap  + extra_skip_dirs
#
# What changes between layouts:
#   categories       — top-level content directories (indexed, searchable)
#   projects         — where per-project summaries live
#   project_subdirs  — which sub-dirs to create under each project
#   extra_skip_dirs  — additional dirs to exclude from indexing/linting

version: 1

categories:
  - domain       # V3 business-domain knowledge (features/scenarios/usecases/functions)
  - artifacts    # V3 time-archived requirements

projects: domain

project_subdirs:
  - features     # each domain/<name>/ holds features/<feat-id>/...

system:
  raw: _raw
  staging: _staging
  archives: _archives
  meta: _meta
  readouts: _readouts

extra_skip_dirs:
  - meta       # V3 governance (templates, conventions, agent-instructions)
  - scripts    # V3 automation (idgenerator, viewgenerator, archiver, ...)
  - .agent     # V3 agent workspace (prompts, context snapshots)
  - traces     # V3 generated views (auto-generated, not manually authored)
